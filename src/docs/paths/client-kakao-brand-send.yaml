paths:
  /api/v1/client/kakao/brand/send:
    post:
      tags:
        - Client Kakao
      summary: 카카오 브랜드메시지(친구톡) 즉시 발송 요청
      description: |
        외주사 클라이언트가 플랫큐브를 통해 카카오 브랜드메시지(구 친구톡) 즉시 발송을 요청합니다.
        `clientCode`와 `apiKey`는 요청 body에 포함하며, server-to-server 인증 정보로 검증합니다.
        발송 전 `clientCode`, `senderPhone`, `profileKey`가 시스템에 등록된 활성 정보인지 확인합니다.
        예약 발송은 현재 시간보다 10분 이상으로 설정해야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - clientCode
                - apiKey
                - messageType
                - recipientPhone
                - senderPhone
                - message
                - profileKey
                - smsGubn
              properties:
                clientCode:
                  type: string
                  description: 외주사 식별 코드
                  example: yglee_a
                apiKey:
                  type: string
                  description: client API Key
                  example: pc_0123456789abcdef1234567890abcdef12345678
                messageType:
                  type: string
                  enum:
                    - BRANDTALK
                  description: 메시지 타입
                  example: BRANDTALK
                recipientPhone:
                  type: array
                  description: 수신자 전화번호 배열(숫자만, 1건 이상)
                  items:
                    type: string
                    example: "01012345678"
                  example:
                    - "01012345678"
                senderPhone:
                  type: string
                  description: 발신번호(prcompany Callback). client에 등록된 senderPhone과 일치해야 합니다.
                  example: "15998898"
                title:
                  type: string
                  description: 문자 제목(선택, 20바이트 이하)
                  example: 브랜드 소식
                message:
                  type: string
                  description: 브랜드메시지 본문(1000자 이하)
                  example: "[브랜드 소식]\n신규 이벤트가 오픈되었습니다."
                profileKey:
                  type: string
                  description: 시스템에 등록된 활성 카카오 발신프로필 키
                  example: 0123456789abcdef1234567890abcdef12345678
                failFlag:
                  type: integer
                  description: prcompany FailFlag. 기본값 0
                  example: 0
                smsGubn:
                  type: string
                  enum:
                    - Y
                    - N
                  description: 실패 시 일반문자 대체발송 여부
                  example: N
                ketc1:
                  type: string
                  description: prcompany 기타1 필드(선택, 160바이트 이하) - 전송주체 구분 활용
                  example: CAMPAIGN-20260521-001
                ketc2:
                  type: string
                  description: prcompany 기타2 필드(선택, 160바이트 이하) - 클라이언트 식별 활용
                  example: yglee_a
                idempotencyKey:
                  type: string
                  description: 중복 요청 방지 키
                  example: brandtalk-CAMPAIGN-20260521-001
            example:
              clientCode: yglee_a
              apiKey: pc_0123456789abcdef1234567890abcdef12345678
              messageType: BRANDTALK
              recipientPhone:
                - "01012345678"
              senderPhone: "15998898"
              title: 브랜드 소식
              message: "[브랜드 소식]\n신규 이벤트가 오픈되었습니다."
              profileKey: 0123456789abcdef1234567890abcdef12345678
              failFlag: 0
              smsGubn: N
              ketc1: CAMPAIGN-20260521-001
              ketc2: yglee_a
              idempotencyKey: brandtalk-CAMPAIGN-20260521-001
      responses:
        "200":
          description: 발송 요청 처리 성공(접수 성공/재시도 예정/최종 실패 포함)
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - messageId
                      - messageType
                      - status
                      - requestedAt
                    properties:
                      messageId:
                        type: integer
                        example: 501
                      messageType:
                        type: string
                        enum:
                          - BRANDTALK
                        example: BRANDTALK
                      status:
                        type: string
                        example: ACCEPTED
                      requestedAt:
                        type: string
                        format: date-time
                        example: "2026-05-21T06:30:00.000Z"
                      reason:
                        type: object
                        nullable: true
                        properties:
                          code:
                            type: string
                            example: MESSAGE_RETRY_SCHEDULED
                          message:
                            type: string
                            example: 공급자 일시 오류로 재시도가 예약되었습니다.
                  error:
                    nullable: true
                    example: null
        "400":
          description: 요청 검증 실패 또는 등록되지 않은 카카오 발신프로필
        "401":
          description: 인증 실패(body.apiKey 또는 clientCode 오류)
        "404":
          description: 클라이언트 없음
